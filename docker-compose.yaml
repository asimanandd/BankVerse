services:
  db: 
    image: postgres:17
    container_name: bankverse-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: bankverse

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
    - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bankverse"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  api:
    build: .
    container_name: bankverse-api
    restart: unless-stopped

    env_file:
      - .env
    
    ports:
      - "8000:8000"
    
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

